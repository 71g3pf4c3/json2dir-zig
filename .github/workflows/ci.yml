name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Format check (nix + zig)
        run: nix develop -c bash -c 'nix fmt && git diff --exit-code'

      - name: flake check (all systems)
        run: nix flake check --all-systems

      - name: Build packages
        run: |
          nix build .#json2dir .#json2dir-static
          ./result/bin/json2dir --version

      - name: Cross builds (no toolchain, just zig)
        run: |
          nix build .#packages.aarch64-linux.json2dir-static
          nix build .#packages.aarch64-darwin.json2dir
